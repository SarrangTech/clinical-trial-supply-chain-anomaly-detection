x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_REGION: ${AWS_REGION:-us-east-1}
    S3_BUCKET: ${S3_BUCKET:-}
    S3_WAREHOUSE_PREFIX: ${S3_WAREHOUSE_PREFIX:-warehouse}
    ICEBERG_CATALOG_NAME: ${ICEBERG_CATALOG_NAME:-clinical_trials}
    ICEBERG_REST_URI: ${ICEBERG_REST_URI:-http://iceberg-rest:8181}
    SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
    COLD_CHAIN_BREACH_MINUTES: ${COLD_CHAIN_BREACH_MINUTES:-30}
    DOSING_WINDOW_DAYS: ${DOSING_WINDOW_DAYS:-3}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./great_expectations:/opt/airflow/great_expectations
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  spark-master:
    # Bitnami retired free-tier images under docker.io/bitnami/* in 2025;
    # the same images now live under docker.io/bitnamilegacy/* (frozen,
    # unmaintained but functional -- fine for local dev use here).
    image: bitnamilegacy/spark:3.5
    environment:
      SPARK_MODE: master
    ports:
      - "7077:7077"
      - "8081:8080"

  spark-worker:
    image: bitnamilegacy/spark:3.5
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
    depends_on:
      - spark-master

  iceberg-rest:
    image: tabulario/iceberg-rest
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: ${POSTGRES_USER:-airflow}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      CATALOG_WAREHOUSE: s3://${S3_BUCKET:-clinical-trial-supply-chain-anomaly-detection}/${S3_WAREHOUSE_PREFIX:-warehouse}
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
    ports:
      - "8181:8181"
    depends_on:
      postgres:
        condition: service_healthy

  fastapi:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_WAREHOUSE_PREFIX: ${S3_WAREHOUSE_PREFIX:-warehouse}
      ICEBERG_CATALOG_NAME: ${ICEBERG_CATALOG_NAME:-clinical_trials}
      ICEBERG_REST_URI: http://iceberg-rest:8181
      API_KEY: ${API_KEY:-dev-local-anomaly-api-key}
      WORKERS: ${WORKERS:-1}
    ports:
      - "8000:8000"
    depends_on:
      iceberg-rest:
        condition: service_started

volumes:
  postgres-data:
  airflow-logs:
